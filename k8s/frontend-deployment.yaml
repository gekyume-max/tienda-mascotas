apiVersion: apps/v1
kind: Deployment
metadata:
  name: tienda-frontend
  namespace: tienda
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tienda-frontend
  template:
    metadata:
      labels:
        app: tienda-frontend
  spec:
    containers:
      - name: frontend
        image: 078638534339.dkr.ecr.us-east-1.amazonaws.com/tienda-frontend:eks-v1
        ports:
          - containerPort: 80
        
        # Recursos obligatorios para que el Metrics Server active el HPA (Autoscaling)
        resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"

        # HEALTH CHECKS 
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10