apiVersion: apps/v1
kind: Deployment
metadata:
  name: tienda-frontend
  namespace: tienda
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tienda-frontend
  template:
    metadata:
      labels:
        app: tienda-frontend
  spec:
    containers:
      - name: frontend
        # Cambia TU_ID_CUENTA_AWS por tu ID real de AWS Academy
        image: TU_ID_CUENTA_AWS.dkr.ecr.us-east-1.amazonaws.com/tienda-frontend:eks-v1
        ports:
          - containerPort: 80
        
        # Recursos obligatorios para que el Metrics Server active el HPA (Autoscaling)
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

        # HEALTH CHECKS (Asegúrate de que tu nginx/frontend responda en la raíz /)
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10